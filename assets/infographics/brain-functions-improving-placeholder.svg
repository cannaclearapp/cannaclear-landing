      <text x="112" y="62" font-size="25" font-weight="800" fill="#083b43">Sleep rhythm</text>
      <text x="112" y="98" font-size="19" fill="#52727b">Often shifts early.</text>
    </g>
    <g transform="translate(450 230)">
      <rect width="300" height="150" rx="24" fill="#e8f6f9"/>
      <circle cx="58" cy="64" r="32" fill="#178796"/>
      <text x="112" y="62" font-size="25" font-weight="800" fill="#083b43">Attention</text>
      <text x="112" y="98" font-size="19" fill="#52727b">Can stabilize gradually.</text>
    </g>
    <g transform="translate(810 230)">
      <rect width="300" height="150" rx="24" fill="#e8f6f9"/>
      <circle cx="58" cy="64" r="32" fill="#178796"/>
      <text x="112" y="62" font-size="25" font-weight="800" fill="#083b43">Memory</text>
      <text x="112" y="98" font-size="19" fill="#52727b">May improve with abstinence.</text>
    </g>
    <g transform="translate(90 430)">
      <rect width="300" height="150" rx="24" fill="#e8f6f9"/>
      <circle cx="58" cy="64" r="32" fill="#178796"/>
      <text x="112" y="62" font-size="25" font-weight="800" fill="#083b43">Motivation</text>
      <text x="112" y="98" font-size="19" fill="#52727b">Returns through routines.</text>
    </g>
    <g transform="translate(450 430)">
      <rect width="300" height="150" rx="24" fill="#e8f6f9"/>
      <circle cx="58" cy="64" r="32" fill="#178796"/>
      <text x="112" y="62" font-size="25" font-weight="800" fill="#083b43">Mood</text>
      <text x="112" y="98" font-size="19" fill="#52727b">Often becomes less reactive.</text>
    </g>
    <g transform="translate(810 430)">
      <rect width="300" height="150" rx="24" fill="#e8f6f9"/>
      <circle cx="58" cy="64" r="32" fill="#178796"/>
      <text x="112" y="62" font-size="25" font-weight="800" fill="#083b43">Clarity</text>
      <text x="112" y="98" font-size="19" fill="#52727b">Usually builds slowly.</text>
    </g>
