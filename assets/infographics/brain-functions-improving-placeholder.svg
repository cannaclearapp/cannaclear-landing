<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Brain functions improving over time placeholder</title>
  <desc id="desc">A simple placeholder graphic showing common brain functions that may improve over time after quitting weed.</desc>
  <rect width="1200" height="760" rx="36" fill="#f7fcfd"/>
  <rect x="42" y="42" width="1116" height="676" rx="30" fill="#fff" stroke="#cfe9ef" stroke-width="2"/>
  <text x="80" y="118" font-family="Arial, sans-serif" font-size="52" font-weight="800" fill="#083b43">Brain Functions Improving Over Time</text>
  <text x="80" y="164" font-family="Arial, sans-serif" font-size="24" fill="#52727b">Different systems often recover at different speeds. Progress usually comes in waves.</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(90 230)">
      <rect width="300" height="150" rx="24" fill="#e8f6f9"/>
