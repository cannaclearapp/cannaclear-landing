<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none">
  <rect width="1600" height="900" rx="40" fill="#F8FDFF"/>
  <rect x="32" y="32" width="1536" height="836" rx="32" fill="white" stroke="#CDECF2" stroke-width="4"/>
  <text x="100" y="120" fill="#0D4350" font-family="Arial, sans-serif" font-size="56" font-weight="700">THC Metabolism to Urine Markers</text>
  <text x="100" y="174" fill="#327082" font-family="Arial, sans-serif" font-size="28">Why urine usually detects metabolites rather than active intoxication</text>
  <circle cx="210" cy="350" r="90" fill="#E8F6F9" stroke="#B9E5EC" stroke-width="4"/>
  <text x="160" y="338" fill="#178796" font-family="Arial, sans-serif" font-size="30" font-weight="700">Use</text>
  <text x="126" y="382" fill="#327082" font-family="Arial, sans-serif" font-size="22">THC enters</text>
  <text x="134" y="412" fill="#327082" font-family="Arial, sans-serif" font-size="22">the body</text>
  <path d="M320 350H470" stroke="#178796" stroke-width="10" stroke-linecap="round"/>
  <path d="M450 330L490 350L450 370" fill="#178796"/>
  <circle cx="610" cy="350" r="90" fill="#E8F6F9" stroke="#B9E5EC" stroke-width="4"/>
  <text x="535" y="338" fill="#178796" font-family="Arial, sans-serif" font-size="30" font-weight="700">Storage</text>
  <text x="534" y="382" fill="#327082" font-family="Arial, sans-serif" font-size="22">Some THC</text>
  <text x="510" y="412" fill="#327082" font-family="Arial, sans-serif" font-size="22">sits in tissues</text>
  <path d="M720 350H870" stroke="#178796" stroke-width="10" stroke-linecap="round"/>
  <path d="M850 330L890 350L850 370" fill="#178796"/>
  <circle cx="1010" cy="350" r="90" fill="#E8F6F9" stroke="#B9E5EC" stroke-width="4"/>
  <text x="908" y="338" fill="#178796" font-family="Arial, sans-serif" font-size="30" font-weight="700">Liver metabolism</text>
  <text x="946" y="382" fill="#327082" font-family="Arial, sans-serif" font-size="22">THC becomes</text>
  <text x="948" y="412" fill="#327082" font-family="Arial, sans-serif" font-size="22">THC-COOH</text>
  <path d="M1120 350H1270" stroke="#178796" stroke-width="10" stroke-linecap="round"/>
  <path d="M1250 330L1290 350L1250 370" fill="#178796"/>
  <circle cx="1410" cy="350" r="90" fill="#E8F6F9" stroke="#B9E5EC" stroke-width="4"/>
  <text x="1364" y="338" fill="#178796" font-family="Arial, sans-serif" font-size="30" font-weight="700">Urine</text>
  <text x="1336" y="382" fill="#327082" font-family="Arial, sans-serif" font-size="22">Metabolites</text>
  <text x="1350" y="412" fill="#327082" font-family="Arial, sans-serif" font-size="22">are detected</text>
  <rect x="100" y="560" width="1400" height="200" rx="28" fill="#F5FBFC" stroke="#CDECF2" stroke-width="4"/>
  <text x="150" y="635" fill="#0D4350" font-family="Arial, sans-serif" font-size="34" font-weight="700">Key point</text>
  <text x="150" y="690" fill="#327082" font-family="Arial, sans-serif" font-size="28">A positive urine result usually means metabolites are still above a testing cutoff.</text>
  <text x="150" y="732" fill="#327082" font-family="Arial, sans-serif" font-size="28">It does not automatically tell you when use happened or whether someone is impaired.</text>
</svg>
