  <rect x="42" y="42" width="1116" height="676" rx="30" fill="#fff" stroke="#cfe9ef" stroke-width="2"/>
  <text x="80" y="120" font-family="Arial, sans-serif" font-size="52" font-weight="800" fill="#083b43">How Cannabis Affects Memory</text>
  <text x="80" y="166" font-family="Arial, sans-serif" font-size="24" fill="#52727b">THC can influence attention, encoding, working memory, and learning while the brain adapts to repeated use.</text>
