    <g transform="translate(640 250)"><rect width="220" height="250" rx="28" fill="#f7fcfd" stroke="#cfe9ef"/><circle cx="110" cy="74" r="42" fill="#178796"/><text x="110" y="158" text-anchor="middle" font-size="25" font-weight="800" fill="#083b43">Hippocampus</text><text x="110" y="198" text-anchor="middle" font-size="19" fill="#52727b">Memory formation</text></g>
