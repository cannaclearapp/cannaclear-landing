<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Memory recovery timeline placeholder</title>
  <desc id="desc">A placeholder infographic showing memory recovery milestones after quitting weed.</desc>
  <rect width="1200" height="760" rx="36" fill="#f7fcfd"/>
  <rect x="42" y="42" width="1116" height="676" rx="30" fill="#fff" stroke="#cfe9ef" stroke-width="2"/>
  <text x="80" y="120" font-family="Arial, sans-serif" font-size="54" font-weight="800" fill="#083b43">Memory Recovery Timeline</text>
  <text x="80" y="168" font-family="Arial, sans-serif" font-size="25" fill="#52727b">Memory often improves through sleep stabilization, clearer attention, and repeated sober learning.</text>
  <path d="M124 380H1076" stroke="#178796" stroke-width="12" stroke-linecap="round"/>
  <g font-family="Arial, sans-serif">
    <g transform="translate(124 260)"><circle cx="0" cy="120" r="36" fill="#178796"/><text x="0" y="130" text-anchor="middle" font-size="28" font-weight="800" fill="#fff">1</text><text x="-58" y="190" font-size="24" font-weight="800" fill="#083b43">Week 1</text><text x="-58" y="226" font-size="20" fill="#52727b">Recall can feel worse</text><text x="-58" y="256" font-size="20" fill="#52727b">during withdrawal.</text></g>
    <g transform="translate(360 260)"><circle cx="0" cy="120" r="36" fill="#178796"/><text x="0" y="130" text-anchor="middle" font-size="28" font-weight="800" fill="#fff">2</text><text x="-72" y="190" font-size="24" font-weight="800" fill="#083b43">Weeks 2-4</text><text x="-72" y="226" font-size="20" fill="#52727b">Sleep and attention</text><text x="-72" y="256" font-size="20" fill="#52727b">may start improving.</text></g>
    <g transform="translate(600 260)"><circle cx="0" cy="120" r="36" fill="#178796"/><text x="0" y="130" text-anchor="middle" font-size="28" font-weight="800" fill="#fff">3</text><text x="-78" y="190" font-size="24" font-weight="800" fill="#083b43">Months 2-3</text><text x="-78" y="226" font-size="20" fill="#52727b">Learning and recall</text><text x="-78" y="256" font-size="20" fill="#52727b">often feel steadier.</text></g>
    <g transform="translate(840 260)"><circle cx="0" cy="120" r="36" fill="#178796"/><text x="0" y="130" text-anchor="middle" font-size="28" font-weight="800" fill="#fff">4</text><text x="-78" y="190" font-size="24" font-weight="800" fill="#083b43">Months 3-6</text><text x="-78" y="226" font-size="20" fill="#52727b">Memory confidence</text><text x="-78" y="256" font-size="20" fill="#52727b">can keep building.</text></g>
    <g transform="translate(1076 260)"><circle cx="0" cy="120" r="36" fill="#178796"/><text x="0" y="130" text-anchor="middle" font-size="28" font-weight="800" fill="#fff">5</text><text x="-126" y="190" font-size="24" font-weight="800" fill="#083b43">6+ months</text><text x="-126" y="226" font-size="20" fill="#52727b">Long-term gains depend</text><text x="-126" y="256" font-size="20" fill="#52727b">on habits and health.</text></g>
  </g>
  <rect x="80" y="610" width="1040" height="58" rx="18" fill="#e8f6f9"/>
  <text x="112" y="647" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0b6f78">Note:</text>
  <text x="176" y="647" font-family="Arial, sans-serif" font-size="22" fill="#083b43">This timeline is educational, not a personal prediction.</text>
</svg>
