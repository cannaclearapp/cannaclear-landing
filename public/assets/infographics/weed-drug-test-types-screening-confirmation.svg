<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Comparison of weed drug-test types, screening tests, confirmation tests and result interpretation</title>
  <desc id="desc">Educational infographic comparing urine, blood, saliva, and hair testing, and showing a simple flow from screening to confirmation with a note that detection is not the same as impairment.</desc>
  <defs>
    <linearGradient id="bg" x1="90" y1="70" x2="1080" y2="740" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FDFF"/>
      <stop offset="1" stop-color="#E9F7FA"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#177D87"/>
      <stop offset="1" stop-color="#1FA29B"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="1200" height="800" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#97D3DE" flood-opacity=".22"/>
    </filter>
  </defs>
  <rect x="24" y="24" width="1152" height="752" rx="36" fill="url(#bg)" stroke="#CBEAF1" filter="url(#shadow)"/>
  <text x="70" y="92" fill="#0F4C5C" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700">How Weed Drug Tests Work</text>
  <text x="70" y="128" fill="#2C6A78" font-family="Arial, Helvetica, sans-serif" font-size="22">Different specimens detect different markers, and a positive result does not automatically prove impairment.</text>

  <rect x="60" y="170" width="500" height="270" rx="28" fill="#FFFFFF" stroke="#CBEAF1"/>
  <text x="90" y="215" fill="#0F4C5C" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Specimen Types</text>
  <rect x="90" y="240" width="180" height="74" rx="18" fill="#EAF8F3"/>
  <text x="112" y="284" fill="#178750" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Urine</text>
  <text x="286" y="284" fill="#2C6A78" font-family="Arial, Helvetica, sans-serif" font-size="22">Usually detects metabolites</text>
  <rect x="90" y="326" width="180" height="74" rx="18" fill="#FCEEF0"/>
  <text x="112" y="370" fill="#C6424D" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Blood</text>
  <text x="286" y="370" fill="#2C6A78" font-family="Arial, Helvetica, sans-serif" font-size="22">More connected to recent exposure</text>
  <rect x="90" y="412" width="180" height="74" rx="18" fill="#F2EDFE"/>
  <text x="112" y="456" fill="#7A49D9" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Saliva</text>
  <text x="286" y="456" fill="#2C6A78" font-family="Arial, Helvetica, sans-serif" font-size="22">Often shorter-window oral-fluid testing</text>
  <rect x="90" y="498" width="180" height="74" rx="18" fill="#FFF4E8"/>
  <text x="112" y="542" fill="#D47A1F" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Hair</text>
  <text x="286" y="542" fill="#2C6A78" font-family="Arial, Helvetica, sans-serif" font-size="22">Longer retrospective window</text>

  <rect x="590" y="170" width="550" height="270" rx="28" fill="#FFFFFF" stroke="#CBEAF1"/>
  <text x="620" y="215" fill="#0F4C5C" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Testing Flow</text>
  <rect x="622" y="250" width="146" height="108" rx="22" fill="#E9F7FA"/>
  <text x="650" y="300" fill="#0F4C5C" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Sample</text>
  <text x="646" y="334" fill="#2C6A78" font-family="Arial, Helvetica, sans-serif" font-size="18">Urine, blood,</text>
  <text x="648" y="357" fill="#2C6A78" font-family="Arial, Helvetica, sans-serif" font-size="18">saliva, hair</text>
  <path d="M778 304H828" stroke="#97C9D3" stroke-width="8" stroke-linecap="round"/>
  <path d="M818 288L842 304L818 320" stroke="#97C9D3" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="850" y="250" width="146" height="108" rx="22" fill="#EAF8F3"/>
  <text x="867" y="296" fill="#178750" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">Screening</text>
  <text x="891" y="328" fill="#2C6A78" font-family="Arial, Helvetica, sans-serif" font-size="18">Preliminary</text>
  <text x="886" y="351" fill="#2C6A78" font-family="Arial, Helvetica, sans-serif" font-size="18">threshold test</text>
  <path d="M922 370V408" stroke="#97C9D3" stroke-width="8" stroke-linecap="round"/>
  <path d="M906 398L922 422L938 398" stroke="#97C9D3" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="850" y="446" width="146" height="108" rx="22" fill="#F2EDFE"/>
  <text x="859" y="492" fill="#6A47C5" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">Confirmation</text>
  <text x="878" y="524" fill="#2C6A78" font-family="Arial, Helvetica, sans-serif" font-size="18">More specific</text>
  <text x="870" y="547" fill="#2C6A78" font-family="Arial, Helvetica, sans-serif" font-size="18">lab method</text>
  <rect x="622" y="446" width="180" height="108" rx="22" fill="#FFF7E8"/>
  <text x="646" y="492" fill="#BD7A1E" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">Cutoff Level</text>
  <text x="647" y="524" fill="#2C6A78" font-family="Arial, Helvetica, sans-serif" font-size="18">Positive or negative</text>
  <text x="650" y="547" fill="#2C6A78" font-family="Arial, Helvetica, sans-serif" font-size="18">depends on threshold</text>

  <rect x="60" y="470" width="500" height="248" rx="28" fill="#FFFFFF" stroke="#CBEAF1"/>
  <text x="90" y="516" fill="#0F4C5C" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Interpretation Basics</text>
  <circle cx="112" cy="568" r="12" fill="url(#teal)"/>
  <text x="138" y="576" fill="#2C6A78" font-family="Arial, Helvetica, sans-serif" font-size="22">Different tests detect different markers</text>
  <circle cx="112" cy="618" r="12" fill="url(#teal)"/>
  <text x="138" y="626" fill="#2C6A78" font-family="Arial, Helvetica, sans-serif" font-size="22">Screening and confirmation are not the same</text>
  <circle cx="112" cy="668" r="12" fill="url(#teal)"/>
  <text x="138" y="676" fill="#2C6A78" font-family="Arial, Helvetica, sans-serif" font-size="22">Detection does not automatically equal impairment</text>

  <rect x="590" y="586" width="550" height="110" rx="28" fill="url(#teal)"/>
  <text x="620" y="635" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">Key Point</text>
  <text x="620" y="672" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="24">No single test gives the whole story, and no method guarantees a negative result.</text>
</svg>
