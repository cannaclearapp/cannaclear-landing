<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">How THC Affects Memory</title>
  <desc id="desc">Placeholder infographic explaining how THC affects memory through CB1 receptors, the hippocampus, attention, learning, and memory formation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fdfe"/>
      <stop offset="1" stop-color="#e8f6f9"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#178796"/>
      <stop offset="1" stop-color="#e2ad37"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0d6d78" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect width="1200" height="760" rx="38" fill="url(#bg)"/>
  <circle cx="1000" cy="120" r="175" fill="#178796" opacity=".08"/>
  <circle cx="166" cy="620" r="150" fill="#e2ad37" opacity=".11"/>
  <text x="600" y="88" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="58" font-weight="800" fill="#073f48">How THC Affects Memory</text>
  <text x="600" y="134" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="25" fill="#51727a">THC can change attention, encoding, and memory formation.</text>
  <path d="M170 360H1030" stroke="url(#line)" stroke-width="8" stroke-linecap="round"/>
  <g filter="url(#shadow)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <g transform="translate(92 234)">
      <rect width="210" height="250" rx="28" fill="#fff" stroke="#ccebf0" stroke-width="2"/>
      <circle cx="105" cy="70" r="42" fill="#e8f6f9"/>
      <text x="105" y="84" text-anchor="middle" font-size="44" fill="#178796">1</text>
      <text x="105" y="142" text-anchor="middle" font-size="25" font-weight="800" fill="#073f48">THC</text>
      <text x="105" y="181" text-anchor="middle" font-size="18" fill="#51727a">Enters the</text>
      <text x="105" y="207" text-anchor="middle" font-size="18" fill="#51727a">bloodstream</text>
    </g>
    <g transform="translate(347 234)">
      <rect width="210" height="250" rx="28" fill="#fff" stroke="#ccebf0" stroke-width="2"/>
      <circle cx="105" cy="70" r="42" fill="#e8f6f9"/>
      <text x="105" y="84" text-anchor="middle" font-size="44" fill="#178796">2</text>
      <text x="105" y="142" text-anchor="middle" font-size="25" font-weight="800" fill="#073f48">CB1 receptors</text>
      <text x="105" y="181" text-anchor="middle" font-size="18" fill="#51727a">Memory and</text>
      <text x="105" y="207" text-anchor="middle" font-size="18" fill="#51727a">attention systems</text>
    </g>
    <g transform="translate(602 234)">
      <rect width="210" height="250" rx="28" fill="#fff" stroke="#ccebf0" stroke-width="2"/>
      <circle cx="105" cy="70" r="42" fill="#e8f6f9"/>
      <text x="105" y="84" text-anchor="middle" font-size="44" fill="#178796">3</text>
      <text x="105" y="142" text-anchor="middle" font-size="25" font-weight="800" fill="#073f48">Hippocampus</text>
      <text x="105" y="181" text-anchor="middle" font-size="18" fill="#51727a">New memories</text>
      <text x="105" y="207" text-anchor="middle" font-size="18" fill="#51727a">encode less smoothly</text>
    </g>
    <g transform="translate(857 234)">
      <rect width="250" height="250" rx="28" fill="#fff" stroke="#ccebf0" stroke-width="2"/>
      <circle cx="125" cy="70" r="42" fill="#e8f6f9"/>
      <text x="125" y="84" text-anchor="middle" font-size="44" fill="#178796">4</text>
      <text x="125" y="142" text-anchor="middle" font-size="25" font-weight="800" fill="#073f48">Memory effects</text>
      <text x="125" y="181" text-anchor="middle" font-size="18" fill="#51727a">Short-term memory,</text>
      <text x="125" y="207" text-anchor="middle" font-size="18" fill="#51727a">learning, and recall</text>
    </g>
  </g>
  <rect x="205" y="565" width="790" height="78" rx="32" fill="#fff" stroke="#ccebf0"/>
  <text x="600" y="598" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22" font-weight="800" fill="#073f48">Key idea</text>
  <text x="600" y="628" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20" fill="#51727a">Cannabis usually affects forming and holding new information more than erasing old memories.</text>
