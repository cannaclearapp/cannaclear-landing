<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Motivation Recovery Timeline</title>
  <desc id="desc">A placeholder infographic showing motivation recovery after quitting weed from week one through six months and beyond.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8feff"/>
      <stop offset="1" stop-color="#e8f6f9"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#178796"/>
      <stop offset=".5" stop-color="#2fbd8d"/>
      <stop offset="1" stop-color="#f0b23b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0b3b43" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1200" height="760" rx="42" fill="url(#bg)"/>
  <circle cx="1040" cy="150" r="160" fill="#178796" opacity=".08"/>
  <text x="600" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="56" font-weight="800" fill="#092f36">Motivation Recovery Timeline</text>
  <text x="600" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#54727a">Drive often returns through small repeated wins.</text>
  <path d="M130 320 H1070" stroke="url(#line)" stroke-width="8" stroke-linecap="round"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g transform="translate(150 320)">
      <circle r="28" fill="#fff" stroke="#178796" stroke-width="7"/>
      <rect x="-74" y="62" width="148" height="170" rx="24" fill="#fff" filter="url(#shadow)"/>
      <text y="105" font-size="22" font-weight="800" fill="#092f36">Week 1</text>
      <text y="139" font-size="17" fill="#178796">Cravings</text>
      <text y="177" font-size="18" fill="#54727a">Fatigue</text>
      <text y="206" font-size="16" fill="#54727a">Low drive</text>
    </g>
    <g transform="translate(380 320)">
      <circle r="28" fill="#fff" stroke="#28a6a3" stroke-width="7"/>
      <rect x="-86" y="62" width="172" height="170" rx="24" fill="#fff" filter="url(#shadow)"/>
      <text y="105" font-size="22" font-weight="800" fill="#092f36">Weeks 2-4</text>
      <text y="139" font-size="17" fill="#178796">Energy</text>
      <text y="177" font-size="18" fill="#54727a">Small wins</text>
      <text y="206" font-size="16" fill="#54727a">Routine starts</text>
    </g>
    <g transform="translate(620 320)">
      <circle r="28" fill="#fff" stroke="#2fbd8d" stroke-width="7"/>
      <rect x="-92" y="62" width="184" height="170" rx="24" fill="#fff" filter="url(#shadow)"/>
      <text y="105" font-size="22" font-weight="800" fill="#092f36">Months 2-3</text>
      <text y="139" font-size="17" fill="#178796">Motivation</text>
      <text y="177" font-size="18" fill="#54727a">Reward</text>
      <text y="206" font-size="16" fill="#54727a">Task initiation</text>
    </g>
    <g transform="translate(860 320)">
      <circle r="28" fill="#fff" stroke="#7b55d7" stroke-width="7"/>
      <rect x="-92" y="62" width="184" height="170" rx="24" fill="#fff" filter="url(#shadow)"/>
      <text y="105" font-size="22" font-weight="800" fill="#092f36">Months 3-6</text>
      <text y="139" font-size="17" fill="#178796">Stability</text>
      <text y="177" font-size="18" fill="#54727a">Enjoyment</text>
      <text y="206" font-size="16" fill="#54727a">Self-trust</text>
    </g>
    <g transform="translate(1060 320)">
      <circle r="28" fill="#fff" stroke="#f0b23b" stroke-width="7"/>
      <rect x="-82" y="62" width="164" height="170" rx="24" fill="#fff" filter="url(#shadow)"/>
      <text y="105" font-size="22" font-weight="800" fill="#092f36">6+ Months</text>
      <text y="139" font-size="17" fill="#178796">Purpose</text>
      <text y="177" font-size="18" fill="#54727a">Balance</text>
      <text y="206" font-size="16" fill="#54727a">Growth</text>
    </g>
  </g>
  <rect x="150" y="590" width="900" height="96" rx="28" fill="#fff" filter="url(#shadow)"/>
  <circle cx="210" cy="638" r="30" fill="#e8f6f9"/>
  <path d="M196 640 l10 10 22-26" fill="none" stroke="#178796" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="265" y="632" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#092f36">Motivation often follows action.</text>
  <text x="265" y="664" font-family="Arial, sans-serif" font-size="20" fill="#54727a">Small repeatable wins help the brain relearn reward without weed.</text>
</svg>
