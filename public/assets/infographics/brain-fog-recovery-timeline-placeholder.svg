<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Brain Fog Recovery Timeline</title>
  <desc id="desc">A placeholder infographic showing gradual brain fog recovery after quitting weed from week one through six months and beyond.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8feff"/>
      <stop offset="1" stop-color="#e8f6f9"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#178796"/>
      <stop offset="0.55" stop-color="#2fbd8d"/>
      <stop offset="1" stop-color="#f0b23b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0b3b43" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1200" height="760" rx="42" fill="url(#bg)"/>
  <circle cx="1020" cy="130" r="150" fill="#178796" opacity=".08"/>
  <circle cx="140" cy="620" r="180" fill="#2fbd8d" opacity=".07"/>
  <text x="600" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="54" font-weight="800" fill="#092f36">Brain Fog Recovery Timeline</text>
  <text x="600" y="136" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#54727a">Clarity usually returns gradually, not all at once.</text>
  <path d="M130 310 H1070" stroke="url(#line)" stroke-width="8" stroke-linecap="round"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g transform="translate(150 310)">
      <circle r="28" fill="#fff" stroke="#178796" stroke-width="7"/>
      <rect x="-72" y="62" width="144" height="170" rx="24" fill="#fff" filter="url(#shadow)"/>
      <text y="105" font-size="22" font-weight="800" fill="#092f36">Week 1</text>
      <text y="139" font-size="17" fill="#178796">Days 1-7</text>
      <text y="178" font-size="18" fill="#54727a">Fog may peak</text>
      <text y="207" font-size="16" fill="#54727a">Sleep and mood</text>
    </g>
    <g transform="translate(380 310)">
      <circle r="28" fill="#fff" stroke="#28a6a3" stroke-width="7"/>
      <rect x="-82" y="62" width="164" height="170" rx="24" fill="#fff" filter="url(#shadow)"/>
      <text y="105" font-size="22" font-weight="800" fill="#092f36">Weeks 2-4</text>
      <text y="139" font-size="17" fill="#178796">Days 8-28</text>
      <text y="178" font-size="18" fill="#54727a">First clear</text>
      <text y="207" font-size="16" fill="#54727a">windows appear</text>
    </g>
    <g transform="translate(620 310)">
      <circle r="28" fill="#fff" stroke="#2fbd8d" stroke-width="7"/>
      <rect x="-92" y="62" width="184" height="170" rx="24" fill="#fff" filter="url(#shadow)"/>
      <text y="105" font-size="22" font-weight="800" fill="#092f36">Months 2-3</text>
      <text y="139" font-size="17" fill="#178796">Days 29-90</text>
      <text y="178" font-size="18" fill="#54727a">Focus and</text>
      <text y="207" font-size="16" fill="#54727a">recall improve</text>
    </g>
    <g transform="translate(860 310)">
      <circle r="28" fill="#fff" stroke="#78bf5b" stroke-width="7"/>
      <rect x="-92" y="62" width="184" height="170" rx="24" fill="#fff" filter="url(#shadow)"/>
      <text y="105" font-size="22" font-weight="800" fill="#092f36">Months 3-6</text>
      <text y="139" font-size="17" fill="#178796">Days 91-180</text>
      <text y="178" font-size="18" fill="#54727a">Mental stamina</text>
      <text y="207" font-size="16" fill="#54727a">gets steadier</text>
    </g>
    <g transform="translate(1060 310)">
      <circle r="28" fill="#fff" stroke="#f0b23b" stroke-width="7"/>
      <rect x="-82" y="62" width="164" height="170" rx="24" fill="#fff" filter="url(#shadow)"/>
      <text y="105" font-size="22" font-weight="800" fill="#092f36">6+ Months</text>
      <text y="139" font-size="17" fill="#178796">180+ days</text>
      <text y="178" font-size="18" fill="#54727a">Long-term</text>
      <text y="207" font-size="16" fill="#54727a">confidence</text>
    </g>
  </g>
  <rect x="150" y="585" width="900" height="96" rx="28" fill="#fff" filter="url(#shadow)"/>
  <circle cx="210" cy="633" r="30" fill="#e8f6f9"/>
  <path d="M198 634 l10 10 18-24" fill="none" stroke="#178796" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="265" y="625" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#092f36">Recovery is not perfectly linear.</text>
  <text x="265" y="659" font-family="Arial, sans-serif" font-size="20" fill="#54727a">Foggy days can still happen while your baseline is improving.</text>
</svg>
