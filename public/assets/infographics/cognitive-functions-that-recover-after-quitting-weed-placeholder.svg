      <circle cx="48" cy="48" r="26" fill="#e8f6f9"/>
      <text x="48" y="58" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="30" fill="#178796">4</text>
      <text x="28" y="92" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="24" font-weight="800" fill="#073f48">Processing speed</text>
      <text x="28" y="126" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" fill="#51727a">Thinking efficiently</text>
