  <rect x="205" y="660" width="790" height="56" rx="28" fill="#fff" stroke="#ccebf0"/>
  <text x="600" y="696" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20" fill="#073f48">Recovery is gradual, individual, and supported by repeated healthy inputs.</text>
