<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Cognitive Functions That Recover After Quitting Weed</title>
  <desc id="desc">Placeholder infographic showing cognitive functions that may improve after quitting weed, including working memory, attention, focus, processing speed, executive function, learning, decision making, and mental flexibility.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fdfe"/>
      <stop offset="1" stop-color="#e8f6f9"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#178796"/>
      <stop offset="1" stop-color="#0d6d78"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0d6d78" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect width="1200" height="760" rx="38" fill="url(#bg)"/>
  <circle cx="1002" cy="128" r="178" fill="#178796" opacity=".08"/>
  <circle cx="174" cy="618" r="150" fill="#e2ad37" opacity=".11"/>
  <text x="600" y="90" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="52" font-weight="800" fill="#073f48">Cognitive Functions That Recover</text>
  <text x="600" y="135" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="26" fill="#51727a">After quitting weed, several mental abilities can improve gradually.</text>
