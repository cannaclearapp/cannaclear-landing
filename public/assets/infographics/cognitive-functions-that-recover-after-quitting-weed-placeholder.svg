      <text x="28" y="48" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="24" font-weight="800" fill="#073f48">Mental flexibility</text>
      <text x="28" y="82" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" fill="#51727a">Adapting without cannabis cues</text>
