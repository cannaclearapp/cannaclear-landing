    <text x="124" y="278" font-size="25" font-weight="800" fill="#083b43">Repeated behavior</text>
    <text x="124" y="310" font-size="19" fill="#52727b">Strengthens pathways.</text>
    <rect x="450" y="580" width="320" height="96" rx="22" fill="#f7fcfd" stroke="#cfe9ef"/>
    <text x="476" y="620" font-size="25" font-weight="800" fill="#083b43">Recovery routines</text>
    <text x="476" y="652" font-size="19" fill="#52727b">Give the brain new input.</text>
