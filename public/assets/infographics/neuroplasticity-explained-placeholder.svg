<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Neuroplasticity explained placeholder</title>
  <desc id="desc">A simple placeholder graphic explaining neuroplasticity as the brain strengthening pathways through repeated behavior.</desc>
  <defs>
    <linearGradient id="grad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#178796"/>
      <stop offset="1" stop-color="#0f8f83"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="760" rx="36" fill="#e8f6f9"/>
  <rect x="42" y="42" width="1116" height="676" rx="30" fill="#fff" stroke="#cfe9ef" stroke-width="2"/>
  <text x="80" y="120" font-family="Arial, sans-serif" font-size="54" font-weight="800" fill="#083b43">Neuroplasticity Explained</text>
  <text x="80" y="168" font-family="Arial, sans-serif" font-size="25" fill="#52727b">The brain adapts through repeated signals, habits, stress levels, sleep, learning, and environment.</text>
  <g stroke="url(#grad)" stroke-width="10" stroke-linecap="round" fill="none">
    <path d="M230 410C350 260 500 260 610 400"/>
    <path d="M610 400C720 540 870 540 990 390"/>
    <path d="M310 520C430 420 570 430 690 520"/>
    <path d="M500 280C610 190 740 210 850 300"/>
  </g>
  <g fill="url(#grad)">
    <circle cx="230" cy="410" r="42"/>
    <circle cx="610" cy="400" r="50"/>
    <circle cx="990" cy="390" r="42"/>
    <circle cx="310" cy="520" r="34"/>
    <circle cx="690" cy="520" r="34"/>
    <circle cx="500" cy="280" r="34"/>
    <circle cx="850" cy="300" r="34"/>
  </g>
  <g font-family="Arial, sans-serif">
